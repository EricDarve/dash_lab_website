- id: "genesis-mission-oracle-2026"
  date: "2026-07-22"
  title: "DASH Lab receives DOE Genesis Mission award for ORACLE"
  summary: "Led by Prof. Eric Darve, ORACLE will develop AI agentic workflows for analyzing large experimental datasets in particle physics, with a focus on the Deep Underground Neutrino Experiment (DUNE). The project brings together Stanford and SLAC researchers through the Department of Energy’s Genesis Mission."
  url: "https://news.stanford.edu/stories/2026/07/stanford-and-slac-to-lead-genesis-mission-projects-that-tackle-the-nation-s-most-complex-science-and-technology-challenges"
  sourceUrl: "https://news.stanford.edu/stories/2026/07/stanford-and-slac-to-lead-genesis-mission-projects-that-tackle-the-nation-s-most-complex-science-and-technology-challenges"

- id: "genesis-mission-subsurface-energy-2026"
  date: "2026-07-22"
  title: "Eric Darve joins Genesis Mission project on subsurface energy"
  summary: "Prof. Eric Darve is co-PI on a DOE Genesis Mission project led by Prof. Hamdi Tchelepi. The team will develop specialized AI agents to simulate underground rock fractures, check results against physical laws, and quantify uncertainty, supporting geothermal and other subsurface energy applications."
  url: "https://news.stanford.edu/stories/2026/07/stanford-and-slac-to-lead-genesis-mission-projects-that-tackle-the-nation-s-most-complex-science-and-technology-challenges"
  sourceUrl: "https://news.stanford.edu/stories/2026/07/stanford-and-slac-to-lead-genesis-mission-projects-that-tackle-the-nation-s-most-complex-science-and-technology-challenges"

