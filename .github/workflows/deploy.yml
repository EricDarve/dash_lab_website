name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # TODO: remove continue-on-error once Eric enables GitHub Pages
    # (Settings -> Pages -> Source: GitHub Actions). Until then every
    # deploy fails with "Ensure GitHub Pages has been enabled", and this
    # keeps those expected failures from spamming run-failed emails.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
